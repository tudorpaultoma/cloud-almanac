<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Almanac</title>
  <meta name="description" content="Cloud Almanac — multi-cloud overview and comparison console.">
  <link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
  <script>
    (function () {
      var t = localStorage.getItem('ca-theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <a class="brand" href="#/infrastructure">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect class="t" x="15" y="12.5" width="45" height="9" rx="4.5"/>
          <rect class="b" x="4" y="27.5" width="52" height="9" rx="4.5"/>
          <rect class="b" x="16.5" y="42.5" width="27" height="9" rx="4.5"/>
        </svg>
        <span class="brand-name">Cloud Almanac</span>
      </a>

      <nav class="nav" id="nav"></nav>

      <div class="sidebar-foot">
        <span class="badge">Preview</span>
        <span class="muted">v0.1</span>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="crumbs">
          <span class="muted">Console</span>
          <span class="sep">/</span>
          <span id="crumb">Infrastructure</span>
        </div>
        <div class="topbar-right">
          <div class="search" aria-disabled="true">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
            <span>Search services, regions…</span>
            <kbd>/</kbd>
          </div>
          <button class="icon-btn" id="themeBtn" aria-label="Toggle light and dark mode" title="Toggle theme">
            <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
          </button>
        </div>
      </header>

      <main class="content" id="content" tabindex="-1"></main>
    </div>
  </div>
  <script src="data/price-tencent-aws-fra.js"></script>
  <script src="data/catalogue-tencent-aws.js"></script>
  <script src="views/price.js"></script>
  <script src="app.js"></script>
</body>
</html>
